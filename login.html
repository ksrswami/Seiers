<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- A paragraph of text -->
    <p>HTML stands for <strong>HyperText Markup Language</strong>. It is the language used to structure pages on the web.</p>

    <!-- A hyperlink connecting to an external site -->
    <p>You can learn more at the <a href="https://www.w3schools.com" target="_blank">W3Schools Official Site</a>.</p>

    <!-- An example bulleted list -->
    <h3>Core Web Technologies</h3>
    <ul>
        <li>HTML (Structure)</li>
        <li>CSS (Style)</li>
        <li>JavaScript (Functionality)</li>
    </ul>

</body>
</html>
